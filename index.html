<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Winner Europa</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Winner Europa">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      gap: 15px;
      background-size: cover;
      background-position: center;
      /* Transición suave de 1.5 segundos entre cambios de imagen o color */
      transition: background-image 1.5s ease-in-out, background-color 1.5s ease-in-out;
      padding-bottom: 20px;
      background-color: #000000;
    }

    .main-buttons-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      align-items: center;
      margin-top: auto;
      margin-bottom: 12vh;
    }

    .main-button {
      background-color: #3CB371;
      color: #000;
      padding: 15px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      text-decoration: none;
      min-width: 260px;
      text-align: center;
    }

    .register-button { background-color: #4682B4; }
    .payment-button { background-color: #6772E5; color: white; }
    .watch-draw-button { background-color: #FFD700; }

    .whatsapp-button {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background-color: #25D366;
      color: white;
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 30px;
      text-decoration: none;
      z-index: 1000;
    }
  </style>
</head>

<body>

  <div class="main-buttons-group">
    <a class="main-button"
       target="_blank"
       href="https://script.google.com/macros/s/AKfycbzqzpN-U77exMbYnqNCJEv7EHTHenFA90pbWdf2nhIdLd8lhP3AHhET6v6dW4A0FYuihg/exec">
      ELIGE TU NUMERO PARA HOY
    </a>
               
    <a id="drawLink"
       class="main-button watch-draw-button"
       target="_blank"
       rel="noopener noreferrer">
      CARGANDO...
    </a>

    <a class="main-button register-button"
       target="_blank"
       href="https://forms.gle/52DnQ2V47fMYYfKH6">
      REGÍSTRATE AQUÍ
    </a>

    <a class="main-button payment-button"
       target="_blank"
       href="https://buy.stripe.com/8x2bITgGedDJbgl59C1kA00">
      PAGAR CON TARJETA
    </a>
  </div>

  <a class="whatsapp-button"
     target="_blank"
     href="https://wa.me/41782515441">
    <i class="fab fa-whatsapp"></i>
  </a>

  <!-- Script para verificar el estado del en vivo en YouTube -->
  <script>
    fetch("/winner-europa/live.json?t=" + Date.now())
      .then(response => response.json())
      .then(data => {
        const btn = document.getElementById("drawLink");
        if (data.live_url && data.live_url.trim() !== "") {
          btn.href = data.live_url;
          btn.innerText = "YouTube EN VIVO 8 de la noche";
        } else {
          btn.innerText = "PRÓXIMO SORTEO";
          btn.href = "#";
        }
      })
      .catch(() => {
        const btn = document.getElementById("drawLink");
        btn.innerText = "NO DISPONIBLE";
        btn.href = "#";
      });
  </script>

  <!-- Script del Service Worker -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./service-worker.js')
          .then(reg => console.log('¡Winner Europa lista para instalar!', reg))
          .catch(err => console.error('Error al registrar Service Worker:', err));
      });
    }
  </script>

  <!-- Script para el carrusel/fondo dinámico cada 15 segundos -->
  <script>
    // Lista con las 3 imágenes de fondo
    // Nota: Reemplaza 'fondo_winner2.jpg' y 'fondo_winner3.jpg' con los nombres reales de tus archivos.
    const images = [
      'fondo_winner.jpg',
      'fondo_winner2.jpg',
      'fondo_winner3.jpg'
    ];

    // Precargamos todas las imágenes en la memoria del navegador para evitar parpadeos
    images.forEach(src => {
      const img = new Image();
      img.src = src;
    });

    let currentIndex = 0;

    function changeBackgroundImage() {
      document.body.style.backgroundImage = `url('${images[currentIndex]}')`;
      // Avanza al siguiente índice y vuelve al inicio (0) al llegar al final
      currentIndex = (currentIndex + 1) % images.length;
    }

    // Primera ejecución inmediata al cargar la página
    changeBackgroundImage();

    // Cambia de imagen automáticamente cada 15.000 ms (15 segundos)
    setInterval(changeBackgroundImage, 15000);
  </script>

</body>
</html>
